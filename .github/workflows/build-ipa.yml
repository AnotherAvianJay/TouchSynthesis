# 在 GitHub 的 macOS 機器上編譯「未簽名」的 IPA，再交給 SideStore 用免費 Apple ID 簽名安裝。
# （本機的 MacBook Pro 2015 只能跑到 Monterey / Xcode 14，編不了這個專案）
name: build-ipa

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write  # 發佈 release

defaults:
  run:
    shell: bash  # 明確指定 bash 才會帶 -eo pipefail，管線裡的失敗不會被吃掉

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # ContentView 用了 iOS 26 的 .glassEffect，要 Xcode 26 的 SDK
      - name: Select Xcode 26
        run: |
          ls -d /Applications/Xcode*.app
          XC=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          sudo xcode-select -s "$XC"
          xcodebuild -version

      - name: Rust iOS target
        run: rustup target add aarch64-apple-ios

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: vendor/idevice

      - name: Build libidevice_ffi
        run: ./scripts/build-idevice.sh

      - name: XcodeGen
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build app (unsigned)
        run: |
          xcodebuild -project TouchSynthesis.xcodeproj -scheme TouchSynthesis \
            -sdk iphoneos -configuration Debug -derivedDataPath build \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM="" \
            build > xcodebuild.log 2>&1 || { grep -E "error:" xcodebuild.log; tail -n 80 xcodebuild.log; exit 1; }
          grep -E "warning: .*(will never|unavailable)" xcodebuild.log | head -20 || true

      - name: Package IPA
        run: |
          APP=build/Build/Products/Debug-iphoneos/TouchSynthesis.app
          test -f "$APP/TouchSynthesis"
          for bin in "$APP/TouchSynthesis" "$APP/TouchSynthesis.debug.dylib"; do
            [ -f "$bin" ] && { echo "== rpaths of $(basename "$bin")"; otool -l "$bin" | grep -A2 LC_RPATH | grep path || true; }
          done
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry TouchSynthesis.ipa Payload
          ls -lh TouchSynthesis.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: TouchSynthesis-ipa
          path: TouchSynthesis.ipa

      # 固定的 latest release，iPhone 上用 Safari 下載後交給 SideStore
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest -y --cleanup-tag || true
          gh release create latest TouchSynthesis.ipa --prerelease \
            --title "TouchSynthesis (unsigned, ${GITHUB_SHA::7})" \
            --notes "未簽名 IPA，用 SideStore 安裝。Built from ${GITHUB_SHA}."
